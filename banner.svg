<svg viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e2a4a"/>
      <stop offset="100%" stop-color="#3d1f4a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="260" fill="url(#bg)"/>
  <!-- simple heartbeat pulse line -->
  <polyline points="40,150 260,150 300,150 330,60 365,220 395,150 430,150 470,110 500,190 530,150 1160,150"
            fill="none" stroke="#ff5c7a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <!-- heart icon -->
  <path d="M300 95 C300 75 280 60 260 60 C245 60 235 68 230 80 C225 68 215 60 200 60 C180 60 160 75 160 95 C160 130 200 155 230 175 C260 155 300 130 300 95 Z"
        fill="#ff5c7a" opacity="0.85" transform="translate(0,0) scale(0.55) translate(180,60)"/>
  <text x="60" y="105" font-family="Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff">
    Heart Disease Detection
  </text>
  <text x="60" y="145" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#c9d1ff">
